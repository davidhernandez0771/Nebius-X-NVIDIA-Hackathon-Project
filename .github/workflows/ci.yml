# Tests on every pull request and on pushes to the integration branch.
# Windows, because the project runs on Windows and the launch-script tests drive
# Windows PowerShell (they skip elsewhere). Isaac, torch and lerobot tests skip
# by themselves: none of those is in the SANT deps.
# The two jobs are separate checkouts on purpose: one Python test checks a
# refusal that needs web/node_modules to be absent.
# Verified locally with these exact commands: docs/RUNBOOK.md, "CI".
name: CI

on:
  pull_request:
  push:
    branches: [perfect-then-multiply]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.12"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  web:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
