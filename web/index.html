<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SANT</title>
    <meta name="description" content="SANT turns one webcam demo into physics-verified robot data." />
    <meta name="theme-color" content="#0B0E11" />
    <!-- The SANT mark, the open-corner tesseract (public/favicon.svg); the PNGs are drawn from it by
         web/scripts/brand-icons.mjs for browsers without SVG icons and for home screens. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- SANT type: Instrument Serif (display), Geist (UI), Geist Mono (numbers), IBM Plex Mono (/record). Fallbacks are in
         web/src/sant/tokens.css; display=swap keeps text visible while they load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
