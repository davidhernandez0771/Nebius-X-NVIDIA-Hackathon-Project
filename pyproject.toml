[project]
name = "nebius-hackathon"
version = "0.1.0"
description = "Nebius x NVIDIA Global AI Hackathon project: NVIDIA Nemotron via Nebius Token Factory"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebius_llm"]
