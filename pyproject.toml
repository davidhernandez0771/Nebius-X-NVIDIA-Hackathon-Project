[project]
name = "nebius-hackathon"
version = "0.1.0"
description = "Nebius x NVIDIA Global AI Hackathon project: NVIDIA Nemotron via Nebius Token Factory"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebius_llm", "src/app"]

[dependency-groups]
dev = [
    "pytest>=8",
]
